# FőzzOkosan – éles (production) stack egyetlen VPS-re.
# Indítás:  docker compose -f docker-compose.prod.yml up -d --build
#
# Nyilvános belépési pont: az nginx (80-as port). A backend és a DB csak a
# belső Docker-hálózaton érhető el (nincs kifelé nyitott portjuk).

services:
  # ---- PostgreSQL adatbázis ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Csak a VPS loopback-jára kötjük (nem publikus!). Így kívülről nem érhető el,
    # viszont SSH-alagúton át a saját gépedről igen (pl. pgAdminnal).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- NestJS backend (REST API) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: production
      PORT: "3001"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Az emailekben szereplő linkek alapja (pl. https://domain vagy http://IP)
      APP_URL: ${APP_URL:-}
      # SMTP (email-küldés). Üres SMTP_HOST esetén az emailek a logba kerülnek.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # A feltöltött és seed-képek tartós tárolása
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---- Nginx: statikus frontend + reverse proxy (belső; a Caddy proxyzza) ----
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  # ---- Caddy: nyilvános belépési pont, automatikus HTTPS (Let's Encrypt) ----
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
