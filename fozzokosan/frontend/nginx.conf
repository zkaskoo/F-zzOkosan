server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Képfeltöltés mérethatára
    client_max_body_size 12M;

    # Tömörítés
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/xml font/woff2;

    # REST API -> backend konténer
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Feltöltött / seed képek -> backend konténer (statikus kiszolgálás)
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Statikus build-assetek hosszú cache-sel (hash-elt fájlnevek)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: minden más útvonal az index.html-re
    location / {
        try_files $uri $uri/ /index.html;
    }
}
